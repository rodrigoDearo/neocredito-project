version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neocredito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neocredito_pass}
      POSTGRES_DB: ${POSTGRES_DB:-neo_credito}
    ports: ['5432:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-neocredito}']
      interval: 5s
      retries: 5

  api:
    build: { context: ., target: development }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neocredito}:${POSTGRES_PASSWORD:-neocredito_pass}@db:5432/${POSTGRES_DB:-neo_credito}
    ports: ['${PORT:-3000}:3000']
    volumes: ['.:/app', '/app/node_modules']
    depends_on:
      db: { condition: service_healthy }
    command: >
      sh -c "npx prisma migrate deploy && npm run seed && npm run start:dev"

volumes:
  postgres_data:
